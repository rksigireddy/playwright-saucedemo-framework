name: Playwright Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Adds a "Run workflow" button inside your GitHub browser UI!

jobs:
  execute-bdd-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Install Playwright Chromium & Linux Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: 4. Run UI, API & Hybrid Tests (Headless Mode)
        run: mvn clean test -Dheadless=true
        continue-on-error: true

      - name: 5. Generate Single-File Allure Report (Works Offline via Double-Click)
        if: always()
        run: |
          mvn allure:install
          .allure/allure-2.29.0/bin/allure generate target/allure-results --clean --single-file -o target/allure-single-report

      - name: 6. Upload Test Reports as Downloadable Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            target/cucumber-report.html
            target/allure-single-report/index.html